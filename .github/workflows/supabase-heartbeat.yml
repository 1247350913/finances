name: Supabase Heartbeat

on:
  schedule:
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Ping dev heartbeat
        run: curl -f "${{ secrets.DEV_HEARTBEAT_URL }}"

      - name: Ping prod heartbeat
        run: curl -f "${{ secrets.PROD_HEARTBEAT_URL }}"