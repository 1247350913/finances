name: CI / CD — Build & Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]   # CI only on PRs (no deploy)

jobs:
  # ── Job 1: Build check (runs on every push/PR) ───────────────────────────
  check:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build check
        run: pnpm build

  # ── Job 2: PR deploy-readiness checks (no production deploy) ──────────────
  deploy-readiness:
    name: Deploy readiness check
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend container (preflight only)
        run: docker build -t finances-api:pr-check .

      - name: Wrangler CLI sanity check
        run: npx --yes wrangler --version

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: gcloud CLI sanity check
        run: gcloud --version

      - name: Validate deploy secrets are present (internal PRs)
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCR_REGION: ${{ secrets.GCR_REGION }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$VITE_API_BASE_URL"
          test -n "$GCP_SA_KEY"
          test -n "$GCP_PROJECT_ID"
          test -n "$GCR_REGION"

      - name: Skip secret presence checks for fork PRs
        if: ${{ github.event.pull_request.head.repo.fork == true }}
        run: echo "Skipping secret checks for fork PR (GitHub does not expose secrets)."

  # ── Job 3: Build frontend & deploy to Cloudflare Pages ───────────────────
  deploy-frontend:
    name: Deploy Frontend → Cloudflare Pages (finances.lnks.info)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vite frontend
        # VITE_ vars are baked into the JS bundle at build time
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=finances --branch=main

  # ── Job 4: Build Docker image & deploy backend to Google Cloud Run ────────
  deploy-backend:
    name: Deploy Backend → Google Cloud Run (api.finances.lnks.info)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCR_REGION }}-docker.pkg.dev --quiet

      - name: Build & push Docker image
        run: |
          IMAGE="${{ secrets.GCR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/finances/api:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          cat > cloudrun-env.yaml <<'EOF'
          NODE_ENV: "production"
          ALLOWED_ORIGINS: "https://finances.lnks.info,https://www.finances.lnks.info,https://finances.pages.dev"
          EOF

          gcloud run deploy finances-api \
            --image "$IMAGE" \
            --region "${{ secrets.GCR_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 60s \
            --env-vars-file cloudrun-env.yaml

